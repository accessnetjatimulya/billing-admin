<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Paket Internet - ACCESSNET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ margin:0; background:#f4f7f6; font-family:Arial,sans-serif; }
    .mobile-topbar { display: none; background: #2c3e50; padding: 10px 15px; color: #fff; position: fixed; top: 0; left: 0; right: 0; z-index: 1001; }
    .sidebar{ position:fixed; top:0; left:0; width:250px; height:100vh; background:#2c3e50; padding:20px; overflow-y:auto; z-index:1000; transition: transform 0.3s ease; }
    .sidebar h4{ color:#fff; }
    .btn-sidebar{ display: block; width:100%; text-align:left; color:#bdc3c7; margin-bottom:8px; border:none; text-decoration: none; padding: 10px; border-radius: 5px; }
    .btn-sidebar:hover, .btn-sidebar.active{ background:#0d6efd !important; color:#fff !important; font-weight:bold; }
    .main-content{ margin-left:250px; padding:30px; }
    
    @media (max-width: 991.98px) {
      .mobile-topbar { display: flex; justify-content: space-between; align-items: center; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.show { transform: translateX(0); }
      .main-content{ margin-left:0; padding-top: 76px; }
    }
  </style>
</head>
<body>

<div class="main-content">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <h2 class="mb-0">Manajemen Paket Internet</h2>
      <button class="btn btn-primary fw-bold" onclick="bukaModalTambah()">➕ Tambah Paket Baru</button>
    </div>

    <div class="card p-3 mb-4 shadow-sm border-0">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Cari Paket</label>
          <input type="text" id="searchPaket" class="form-control" placeholder="Ketik nama paket..." onkeyup="jalankanFilterData()">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Filter Kategori / Tipe</label>
          <select id="filterTipe" class="form-select" onchange="jalankanFilterData()">
            <option value="SEMUA">-- Tampilkan Semua Tipe --</option>
            <option value="PPP">PPP</option>
            <option value="HOTSPOT">HOTSPOT</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>TIPE</th>
              <th>NAMA PAKET</th>
              <th>HARGA</th>
              <th class="text-center" style="width: 180px;">AKSI</th>
            </tr>
          </thead>
          <tbody id="tabelPaketBody">
            <tr>
              <td colspan="4" class="text-center py-4">Memuat data paket internet...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalPaket" data-bs-backdrop="static" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalTitle">Tambah Paket Baru</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="f_id">
        <div class="mb-3">
          <label class="form-label fw-bold">Tipe Paket</label>
          <select id="f_tipe" class="form-select">
            <option value="PPP">PPP</option>
            <option value="HOTSPOT">HOTSPOT</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Nama Paket</label>
          <input type="text" id="f_nama" class="form-control" placeholder="Contoh: PP-20M atau Hs-1hp">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Harga Paket (Rp)</label>
          <input type="number" id="f_harga" class="form-control" placeholder="Contoh: 250000">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary fw-bold" id="btnSimpan" onclick="simpanPaket()">Simpan Paket</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="global.js"></script>

<script>
  // Inisialisasi awal saat halaman dibuka
  checkLogin();
  renderNavigation('paket-internet');

  let listSemuaPaket = [];
  let modalInstance = null;

  document.addEventListener("DOMContentLoaded", function() {
    modalInstance = new bootstrap.Modal(document.getElementById('modalPaket'));
    loadDataPaket();
  });

  // Ambil data paket dari Google Sheets melalui API Web App
  function loadDataPaket() {
    const tbody = document.getElementById('tabelPaketBody');
    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Memuat data Paket Internet...</td></tr>`;
    
    callAPI('getPaket', null, function(data) {
      listSemuaPaket = data || [];
      jalankanFilterData(); 
    }, function(err) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Gagal mengambil data: ${err}</td></tr>`;
    });
  }

  // Fungsi Inti Penyaringan
  function jalankanFilterData() {
    const kataKunci = document.getElementById('searchPaket').value.toLowerCase().trim();
    const tipeTerpilih = document.getElementById('filterTipe').value;
    const tbody = document.getElementById('tabelPaketBody');

    const dataHasilFilter = listSemuaPaket.filter(paket => {
      const cocokTipe = (tipeTerpilih === 'SEMUA' || paket.TIPE === tipeTerpilih);
      const cocokNama = paket.NAMA.toLowerCase().includes(kataKunci);
      return cocokTipe && cocokNama;
    });

    if (dataHasilFilter.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Tidak ada data paket yang cocok.</td></tr>`;
      return;
    }

    let html = '';
    dataHasilFilter.forEach(paket => {
      const badgeColor = paket.TIPE === 'PPP' ? 'bg-info text-dark' : 'bg-warning text-dark';
      html += `
        <tr>
          <td><span class="badge ${badgeColor} fw-bold">${paket.TIPE}</span></td>
          <td class="fw-bold text-secondary">${paket.NAMA}</td>
          <td>Rp ${Number(paket.HARGA).toLocaleString('id-ID')}</td>
          <td>
            <div class="d-flex justify-content-center align-items-center gap-2">
              <button class="btn btn-sm btn-outline-dark" onclick="bukaModalEdit('${paket.ID}')">✏️ Edit</button>
              <button class="btn btn-sm btn-danger" onclick="hapusPaket('${paket.ID}')">🗑️ Hapus</button>
            </div>
          </td>
        </tr>`;
    });
    tbody.innerHTML = html;
  }

  function bukaModalTambah() {
    document.getElementById('modalTitle').innerText = 'Tambah Paket Baru';
    document.getElementById('f_id').value = '';
    document.getElementById('f_tipe').value = 'PPP';
    document.getElementById('f_nama').value = '';
    document.getElementById('f_harga').value = '';
    modalInstance.show();
  }

  function bukaModalEdit(id) {
    const p = listSemuaPaket.find(x => x.ID == id);
    if (!p) return;
    
    document.getElementById('modalTitle').innerText = 'Edit Paket Internet';
    document.getElementById('f_id').value = p.ID;
    document.getElementById('f_tipe').value = p.TIPE;
    document.getElementById('f_nama').value = p.NAMA;
    document.getElementById('f_harga').value = p.HARGA;
    
    modalInstance.show();
  }

  function simpanPaket() {
    const btnSimpan = document.getElementById('btnSimpan');
    const namaPaket = document.getElementById('f_nama').value.trim();
    const hargaPaket = document.getElementById('f_harga').value.trim();

    if (!namaPaket || hargaPaket === '') {
      alert('Nama paket dan harga wajib diisi!');
      return;
    }

    btnSimpan.disabled = true;
    btnSimpan.innerText = 'Menyimpan...';

    const payload = {
      ID: document.getElementById('f_id').value,
      TIPE: document.getElementById('f_tipe').value,
      NAMA: namaPaket,
      HARGA: hargaPaket
    };

    callAPI('savePaket', payload, function(res) {
      alert(res);
      modalInstance.hide();
      loadDataPaket();
      btnSimpan.disabled = false;
      btnSimpan.innerText = 'Simpan Paket';
    }, function(err) {
      alert('Gagal menyimpan paket: ' + err);
      btnSimpan.disabled = false;
      btnSimpan.innerText = 'Simpan Paket';
    });
  }

  function hapusPaket(id) {
    if (confirm('Apakah Anda yakin ingin menghapus data paket ini secara permanen?')) {
      callAPI('deletePaket', id, function(res) {
        alert(res);
        loadDataPaket();
      }, function(err) {
        alert('Gagal menghapus paket: ' + err);
      });
    }
  }
</script>
</body>
</html>
