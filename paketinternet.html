<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kelola Paket Internet - ACCESSNET</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{ margin:0; background:#f4f7f6; font-family:Arial,sans-serif; }
    .mobile-topbar { display: none; background: #2c3e50; padding: 10px 15px; color: #fff; position: fixed; top: 0; left: 0; right: 0; z-index: 1001; }
    .sidebar{ position:fixed; top:0; left:0; width:250px; height:100vh; background:#2c3e50; padding:20px; overflow-y:auto; z-index:1000; transition: transform 0.3s ease; }
    .sidebar h4{ color:#fff; }
    .btn-sidebar{ display: block; width:100%; text-align:left; color:#bdc3c7; margin-bottom:8px; border:none; text-decoration: none; padding: 10px; border-radius: 5px; }
    .btn-sidebar:hover, .btn-sidebar.active{ background:#0d6efd !important; color:#fff !important; font-weight:bold; }
    .main-content{ margin-left:250px; padding:30px; }
    
    @media (max-width: 991.98px) {
      .mobile-topbar { display: flex; justify-content: space-between; align-items: center; }
      .sidebar { transform: translateX(-100%); }
      .sidebar.show { transform: translateX(0); }
      .main-content{ margin-left:0; padding-top: 76px; }
    }
  </style>
</head>
<body>

<div class="main-content">
  <div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
      <h2 class="mb-0">Manajemen Paket Internet</h2>
      <button class="btn btn-primary fw-bold" onclick="bukaModalTambah()">➕ Tambah Paket Baru</button>
    </div>

    <div class="card p-3 mb-4 shadow-sm border-0">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-bold">Cari Paket</label>
          <input type="text" id="searchPaket" class="form-control" placeholder="Ketik nama paket..." onkeyup="jalankanFilterData()">
        </div>
        <div class="col-md-6">
          <label class="form-label fw-bold">Filter Kategori / Tipe</label>
          <select id="filterTipe" class="form-select" onchange="jalankanFilterData()">
            <option value="SEMUA">-- Tampilkan Semua Tipe --</option>
            <option value="PPP">PPP</option>
            <option value="HOTSPOT">HOTSPOT</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card shadow-sm border-0">
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-dark">
            <tr>
              <th>TIPE</th>
              <th>NAMA PAKET</th>
              <th>HARGA</th>
              <th class="text-center" style="width: 180px;">AKSI</th>
            </tr>
          </thead>
			<tbody id="tabelPaketBody">
			  <tr>
				<td colspan="5" class="text-center py-4">
				  <div class="spinner-border spinner-border-sm text-primary" role="status"></div> Memuat data paket internet...
				</td>
			  </tr>
			</tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalPaket" data-bs-backdrop="static" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="modalTitle">Tambah Paket Baru</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="f_id">
        <div class="mb-3">
          <label class="form-label fw-bold">Tipe Paket</label>
          <select id="f_tipe" class="form-select">
            <option value="PPP">PPP</option>
            <option value="HOTSPOT">HOTSPOT</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Nama Paket</label>
          <input type="text" id="f_nama" class="form-control" placeholder="Contoh: PP-20M atau Hs-1hp">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Harga Paket (Rp)</label>
          <input type="number" id="f_harga" class="form-control" placeholder="Contoh: 250000">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary fw-bold" id="btnSimpan" onclick="simpanPaket()">Simpan Paket</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="global.js"></script>

<script>
  // Inisialisasi awal saat halaman dibuka
  checkLogin();
  renderNavigation('paket-internet');

  let listSemuaPaket = [];
  let modalInstance = null;

  document.addEventListener("DOMContentLoaded", function() {
    modalInstance = new bootstrap.Modal(document.getElementById('modalPaket'));
    loadDataPaket();
  });

  // FUNGSI KHUSUS: Tampilkan Popup Notifikasi Berhasil (Toast Floating)
  function tampilkanPopupSukses(pesan) {
    let container = document.getElementById('toastSuksesContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastSuksesContainer';
      container.className = 'toast-container position-fixed top-0 end-0 p-3';
      container.style.zIndex = '9999';
      document.body.appendChild(container);
    }

    const toastId = 'toast-' + Date.now();
    const toastHtml = `
      <div id="${toastId}" class="toast align-items-center text-bg-success border-0 show shadow-lg mb-2" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
          <div class="toast-body fw-bold fs-6">
            ✅ ${pesan}
          </div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" onclick="document.getElementById('${toastId}').remove()"></button>
        </div>
      </div>
    `;

    container.insertAdjacentHTML('beforeend', toastHtml);

    setTimeout(() => {
      const el = document.getElementById(toastId);
      if (el) {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 300);
      }
    }, 2500);
  }

  // 1. Ambil data paket dari Google Sheets melalui API Web App
  function loadDataPaket(isBackgroundSync = false) {
    const tbody = document.getElementById('tabelPaketBody');
    const cachedData = localStorage.getItem('CACHE_LOCAL_PAKET');

    if (!isBackgroundSync && tbody) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary" role="status"></div> Memuat data Paket Internet...</td></tr>`;
    }

    setTimeout(function() {
      if (cachedData) {
        try {
          listSemuaPaket = JSON.parse(cachedData) || [];
          jalankanFilterData();
        } catch (e) {
          console.warn("Gagal membaca cache paket:", e);
        }
      }
    }, 200);

    callAPI('getPaket', null, function(data) {
      if (Array.isArray(data)) {
        listSemuaPaket = data;
        localStorage.setItem('CACHE_LOCAL_PAKET', JSON.stringify(data));
        jalankanFilterData();
      }
    }, function(err) {
      console.warn("Sync background server gagal/delay:", err);
      if (!cachedData && tbody) {
        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Gagal mengambil data dari server. Silakan muat ulang.</td></tr>`;
      }
    });
  }

  // 2. Fungsi Filter Data Paket
  function jalankanFilterData() {
    const kataKunci = document.getElementById('searchPaket').value.toLowerCase().trim();
    const tipeTerpilih = document.getElementById('filterTipe').value;
    const tbody = document.getElementById('tabelPaketBody');

    if (!tbody) return;

    const dataHasilFilter = listSemuaPaket.filter(paket => {
      const cocokTipe = (tipeTerpilih === 'SEMUA' || paket.TIPE === tipeTerpilih);
      const namaValid = paket.NAMA ? String(paket.NAMA).toLowerCase() : '';
      const cocokNama = namaValid.includes(kataKunci);
      return cocokTipe && cocokNama;
    });

    if (dataHasilFilter.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Tidak ada data paket yang cocok.</td></tr>`;
      return;
    }

    let html = '';
    dataHasilFilter.forEach(paket => {
      const badgeColor = paket.TIPE === 'PPP' ? 'bg-info text-dark' : 'bg-warning text-dark';
      html += `
        <tr>
          <td><span class="badge ${badgeColor} fw-bold">${paket.TIPE || 'PPP'}</span></td>
          <td class="fw-bold text-secondary">${paket.NAMA || '-'}</td>
          <td>Rp ${Number(paket.HARGA || 0).toLocaleString('id-ID')}</td>
          <td>
            <div class="d-flex justify-content-center align-items-center gap-2">
              <button class="btn btn-sm btn-outline-dark" onclick="bukaModalEdit('${paket.ID}')">✏️ Edit</button>
              <button class="btn btn-sm btn-danger" onclick="hapusPaket('${paket.ID}')">🗑️ Hapus</button>
            </div>
          </td>
        </tr>`;
    });
    tbody.innerHTML = html;
  }

  // 3. Buka Modal Tambah Paket (ID Harus Kosong "")
  function bukaModalTambah() {
    document.getElementById('modalTitle').innerText = 'Tambah Paket Baru';
    document.getElementById('f_id').value = ''; // KOSONGKAN ID AGAR BACKEND MEMBUAT ID BARU
    document.getElementById('f_tipe').value = 'PPP';
    document.getElementById('f_nama').value = '';
    document.getElementById('f_harga').value = '';
    if (modalInstance) modalInstance.show();
  }

  // 4. Buka Modal Edit Paket (ID Memakai ID Asli dari Sheet)
  function bukaModalEdit(id) {
    const p = listSemuaPaket.find(x => String(x.ID) === String(id));
    if (!p) {
      alert('Data paket tidak ditemukan!');
      return;
    }
    
    document.getElementById('modalTitle').innerText = 'Edit Paket Internet';
    document.getElementById('f_id').value = p.ID; // GUNAKAN ID ASLI DARI GOOGLE SHEET (misal: PKTP_12)
    document.getElementById('f_tipe').value = p.TIPE || 'PPP';
    document.getElementById('f_nama').value = p.NAMA || '';
    document.getElementById('f_harga').value = p.HARGA || '';
    
    if (modalInstance) modalInstance.show();
  }

  // 5. Simpan Paket (Tambah / Edit)
  function simpanPaket() {
    const btnSimpan = document.getElementById('btnSimpan');
    const idPaket = document.getElementById('f_id').value.trim();
    const tipePaket = document.getElementById('f_tipe').value;
    const namaPaket = document.getElementById('f_nama').value.trim();
    const hargaPaket = document.getElementById('f_harga').value.trim();

    if (!namaPaket || hargaPaket === '') {
      alert('Nama paket dan harga wajib diisi!');
      return;
    }

    // Efek Processing pada Tombol
    if (btnSimpan) {
      btnSimpan.disabled = true;
      btnSimpan.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Menyimpan...`;
    }

    const isEdit = idPaket !== "";

    const payload = {
      ID: idPaket, // Kirim ID asli jika Edit, atau "" jika Tambah Baru
      TIPE: tipePaket,
      NAMA: namaPaket,
      HARGA: hargaPaket
    };

    // Update Tampilan Lokal Instan (Optimistic Update)
    if (isEdit) {
      const idx = listSemuaPaket.findIndex(p => String(p.ID) === String(idPaket));
      if (idx !== -1) {
        listSemuaPaket[idx] = { ...listSemuaPaket[idx], ...payload };
      }
    } else {
      // Sementara tampilkan di paling atas dengan temp ID
      listSemuaPaket.unshift({ ...payload, ID: 'TEMP-' + Date.now() });
    }

    localStorage.setItem('CACHE_LOCAL_PAKET', JSON.stringify(listSemuaPaket));
    jalankanFilterData();

    // Tutup Modal & Tampilkan Popup Sukses
    setTimeout(() => {
      if (btnSimpan) {
        btnSimpan.disabled = false;
        btnSimpan.innerHTML = 'Simpan Paket';
      }
      if (modalInstance) modalInstance.hide();

      const pesanSukses = isEdit ? 'Paket internet berhasil diperbarui!' : 'Paket internet baru berhasil ditambahkan!';
      tampilkanPopupSukses(pesanSukses);
    }, 400);

    // Kirim ke Backend Google Apps Script
    callAPI('savePaket', payload, function(res) {
      console.log("Response simpan backend:", res);
      // Refresh data resmi dari server untuk menyelaraskan ID baru dari sheet
      loadDataPaket(true);
    }, function(err) {
      console.warn("Pengiriman paket ke server gagal/ditunda:", err);
      loadDataPaket(true);
    });
  }

  // 6. Hapus Paket
  function hapusPaket(id) {
    if (!confirm('Apakah Anda yakin ingin menghapus data paket ini secara permanen?')) return;

    listSemuaPaket = listSemuaPaket.filter(p => String(p.ID) !== String(id));
    localStorage.setItem('CACHE_LOCAL_PAKET', JSON.stringify(listSemuaPaket));
    jalankanFilterData();

    tampilkanPopupSukses('Paket internet berhasil dihapus!');

    callAPI('deletePaket', id, function(res) {
      console.log("Response hapus backend:", res);
    }, function(err) {
      console.warn("Hapus data di server gagal/ditunda:", err);
    });
  }
</script>
</body>
</html>
