<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Login ACCESSNET</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- TAMBAHAN BOOTSTRAP ICONS UNTUK IKON MATA -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<style>

*{
  box-sizing:border-box;
}

/* BACKGROUND DARK BLUE RADIAL GRADIENT */
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top left, #0b1e42 0%, #030814 100%);
  background-attachment: fixed;
  font-family:Arial,sans-serif;
  padding:20px;
  color: #e2e8f0;
}

/* KARTU LOGIN GLASSMORPHISM */
.card-login{
  width:100%;
  max-width:420px;
  border:1px solid rgba(255, 255, 255, 0.1);
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.logo-title{
  font-size:32px;
  font-weight:bold;
  color:#0d6efd;
  text-align:center;
  margin-bottom:8px;
}

.sub-title{
  text-align:center;
  color:#94a3b8;
  margin-bottom:30px;
  font-size:15px;
}

.form-label{
  font-size:14px;
  color: #f8fafc;
}

/* INPUT FORM GELAP */
.form-control{
  height:50px;
  border-radius:12px;
  font-size:16px;
  background-color: rgba(15, 23, 42, 0.6) !important;
  border: 1px solid rgba(255, 255, 255, 0.15) !important;
  color: #ffffff !important;
}

/* STYLE UNTUK GROUP INPUT PASSWORD + TOMBOL MATA */
.input-group .form-control {
  border-top-right-radius: 0 !important;
  border-bottom-right-radius: 0 !important;
}

.btn-toggle-password {
  background-color: rgba(15, 23, 42, 0.6) !important;
  border: 1px solid rgba(255, 255, 255, 0.15) !important;
  border-left: none !important;
  color: #94a3b8 !important;
  border-top-right-radius: 12px !important;
  border-bottom-right-radius: 12px !important;
  padding: 0 15px;
  display: flex;
  align-items: center;
  cursor: pointer;
}

.btn-toggle-password:hover {
  color: #ffffff !important;
}

.form-control:focus{
  border-color: #2563eb !important;
  box-shadow: 0 0 10px rgba(37, 99, 235, 0.4) !important;
}

.form-control::placeholder{
  color: #64748b;
}

/* TOMBOL LOGIN GLOW */
.btn-login{
  height:50px;
  border-radius:12px;
  font-size:16px;
  background-color: #2563eb;
  border: none;
  box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
  transition: all 0.2s ease;
}

.btn-login:hover{
  background-color: #1d4ed8;
  box-shadow: 0 0 20px rgba(37, 99, 235, 0.6);
}

#infoLogin{
  min-height:24px;
  font-size:14px;
}

@media(max-width:576px){

  body{
    padding:15px;
    align-items:flex-start;
    padding-top:40px;
  }

  .card-login{
    max-width:100%;
    border-radius:16px;
  }

  .logo-title{
    font-size:28px;
  }

  .sub-title{
    font-size:14px;
  }

  .form-control, .btn-toggle-password{
    height:48px;
    font-size:15px;
  }

  .btn-login{
    height:48px;
    font-size:15px;
  }

}

</style>
</head>
<body>

<div class="card card-login p-4 p-md-5">

  <div class="text-center mb-3">
	  <img 
		src="logo-accessnet.png"
		alt="ACCESSNET"
		style="
		  width:200px;
		  height:90px;
		  object-fit:contain;
		"
	  >
	</div>

  <div class="sub-title">
    Sistem Manajemen Pelanggan & Invoice
  </div>

  <div class="mb-3">
    <label class="form-label fw-bold">
      Username
    </label>

    <input 
      type="text" 
      id="username" 
      class="form-control"
      placeholder="Masukkan username"
      autocomplete="username"
    >
  </div>

  <div class="mb-4">
    <label class="form-label fw-bold">
      Password
    </label>

    <!-- INPUT GROUP DENGAN TOMBOL MATA SHOW/HIDE -->
    <div class="input-group">
      <input 
        type="password" 
        id="password" 
        class="form-control"
        placeholder="Masukkan password"
        autocomplete="current-password"
        onkeypress="if(event.key==='Enter'){prosesLogin()}"
      >
      <button type="button" class="btn btn-toggle-password" onclick="togglePassword()">
        <i id="iconMata" class="bi bi-eye-slash"></i>
      </button>
    </div>
  </div>

  <button onclick="prosesLogin()" class="btn btn-primary w-100 fw-bold btn-login">
    LOGIN
  </button>

  <div id="infoLogin" class="text-danger text-center mt-3 fw-bold"></div>

</div>

<script src="global.js"></script>

<script>

if(localStorage.getItem('ACCESSNET_LOGIN') === 'LOGIN_OK'){
  window.location.replace('index.html');
}

// FUNGSI SHOW / HIDE PASSWORD
function togglePassword() {
  const pwdInput = document.getElementById('password');
  const iconMata = document.getElementById('iconMata');

  if (pwdInput.type === 'password') {
    pwdInput.type = 'text';
    iconMata.classList.remove('bi-eye-slash');
    iconMata.classList.add('bi-eye');
  } else {
    pwdInput.type = 'password';
    iconMata.classList.remove('bi-eye');
    iconMata.classList.add('bi-eye-slash');
  }
}

function prosesLogin(){

  const btn = document.querySelector('.btn-login');

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if(!username || !password){
    document.getElementById('infoLogin').innerText = 'Username & Password wajib diisi';
    return;
  }

  btn.disabled = true;
  btn.innerText = 'MEMPROSES...';

  callAPI('loginAccessnet', {
    username: username,
    password: password
  }, function(res){

    btn.disabled = false;
    btn.innerText = 'LOGIN';

    if(res && res.status === true){

      localStorage.setItem('ACCESSNET_LOGIN', 'LOGIN_OK');

      window.location.replace('index.html');

    } else {

      document.getElementById('infoLogin').innerText = 'Username / Password salah';

    }

  }, function(err){

    btn.disabled = false;
    btn.innerText = 'LOGIN';

    document.getElementById('infoLogin').innerText = 'Gagal koneksi server';

  });
}

</script>

</body>
</html>
